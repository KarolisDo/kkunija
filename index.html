<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kkunija įrankiai</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --border: #dfe4e8;
    --text: #1f2933;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 16px 40px;
  }

  h1 {
    font-size: 1.4rem;
    margin: 0 0 6px;
  }

  p.intro {
    color: var(--muted);
    margin: 0 0 24px;
  }

  .tool-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  a.tool-card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--text);
  }

  a.tool-card:hover {
    border-color: var(--accent);
  }

  .tool-name {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--accent-dark);
  }

  .tool-path {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 2px;
  }
</style>
</head>
<body>
<main>
  <h1>Kkunija įrankiai</h1>
  <p class="intro">Vidiniai vieno puslapio įrankiai. Pasirinkite:</p>
  <div class="tool-list">
    <a class="tool-card" href="/karolis/">
      <div class="tool-name">Dokumentų kontrolinis sąrašas</div>
      <div class="tool-path">/karolis/</div>
    </a>
    <a class="tool-card" href="/marius/">
      <div class="tool-name">Įmokos skaičiuoklė pokalbiui (marius)</div>
      <div class="tool-path">/marius/</div>
    </a>
    <a class="tool-card" href="/imokos-skaiciuokle/">
      <div class="tool-name">Įmokos skaičiuoklė pokalbiui (imokos-skaiciuokle)</div>
      <div class="tool-path">/imokos-skaiciuokle/</div>
    </a>
  </div>
</main>
</body>
</html>
